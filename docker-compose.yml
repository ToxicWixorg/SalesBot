services:
  bot:
    container_name: bot2-bot
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.production
        required: false
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: bot2-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bot2
      - POSTGRES_PASSWORD=991fa522db6ddb9935c7d9b1
      - POSTGRES_DB=bot2
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bot2_postgres_data:/var/lib/postgresql/data

  redis:
    container_name: bot2-redis
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - bot2_redis_data:/data

volumes:
  bot2_postgres_data:
  bot2_redis_data:
