# The bot itself runs on the host via PM2/Bun (see manager.sh + ecosystem.config.cjs).
# Docker only provides the datastores (Postgres + Redis). Do NOT add a "bot"
# service here — running it in Docker AND under PM2 would start two instances on
# the same token and Telegram would return 409 Conflict.
services:
  postgres:
    container_name: bot-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=991fa522db6ddb9935c7d9b1
      - POSTGRES_DB=bot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: bot-redis
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--bind",
        "0.0.0.0",
        "--port",
        "6379",
        "--protected-mode",
        "no",
      ]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
