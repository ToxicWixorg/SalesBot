services:
  bot:
    container_name: bot-bot
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.production
        required: false
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: bot-postgres
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=991fa522db6ddb9935c7d9b1
      - POSTGRES_DB=bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: bot-redis
    image: redis:latest
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
